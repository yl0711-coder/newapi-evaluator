<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>上线与飞书 · 模型渠道测试平台</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="launches.css"></head><body>
<div class="topbar"><div class="inner"><span class="logo">模型渠道测试平台</span><nav><a href="index.html">首页</a><a href="workspace.html">模型工作台</a><a href="insights.html">生产洞察</a><a href="incidents.html">异常归因</a><a href="launches.html" class="on">上线与飞书</a><a href="history.html">任务与报告</a></nav></div></div>
<main class="launch-page"><header><div class="eyebrow">Human-confirmed launch</div><h1>渠道上线确认与飞书同步</h1><p class="lead">测试平台生成草案，人手工上线；只读核验成功后，预览差异并确认同步飞书。</p></header><div id="notice" class="notice err hide"></div><div class="boundary">测试平台永不写入中转站配置；中转站是上线事实源，飞书只是运营视图。</div>
<section class="launch-grid"><aside class="card"><h2>渠道</h2><div id="channel-list" class="channel-list"></div></aside><div id="launch-detail" class="launch-detail"><div class="card empty">选择有准入报告的渠道开始。</div></div></section>
<details class="card advanced"><summary><strong>外部集成配置</strong><small>只读上线接口与飞书多维表格</small></summary><div class="advanced-body"><section><h2>中转站只读上线接口</h2><form id="verify-source-form" class="source-form"><input id="verify-name" placeholder="数据源名称" required><input id="verify-endpoint" type="url" placeholder="https://relay.example/api/online-channels" required><input id="verify-token" type="password" placeholder="只读 Token"><button class="primary">添加</button></form><div id="verify-sources"></div></section><section><h2>飞书多维表格</h2><form id="feishu-form" class="feishu-form"><input id="feishu-app-id" placeholder="App ID" required><input id="feishu-secret" type="password" placeholder="App Secret（更新时可留空）"><input id="feishu-base" placeholder="多维表格 Base Token" required><input id="feishu-channel-table" placeholder="渠道表 Table ID" required><input id="feishu-model-table" placeholder="模型映射表 Table ID" required><button class="primary">保存</button></form><p class="help">应用密钥仅加密存本机；渠道 Key、完整敏感 URL 和原始错误响应永不写飞书。</p></section></div></details>
</main><script src="app.js"></script><script src="launches.js"></script></body></html>
