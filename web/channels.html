<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公共渠道 | 模型测试工作台</title><link rel="stylesheet" href="/assets/common.css"><script src="/assets/common.js" defer></script><script src="/assets/channels.js" defer></script></head>
<body><main class="page"><p class="eyebrow">SHARED CHANNELS</p><h1>一份渠道资料，三个工具共用。</h1><p class="muted">保存名称、Base URL、密钥和倍率。密钥保存后不再回显，修改时留空即可保留。</p>
<div class="toolbar"><input id="search" type="search" placeholder="搜索名称、地址或分类" aria-label="搜索渠道"><select id="status-filter" aria-label="状态筛选"><option value="">全部渠道</option><option value="online">已上线</option><option value="recorded">已记录</option></select><button id="refresh" class="secondary">刷新</button><button id="add">新增已上线渠道</button></div>
<p id="count" class="hint"></p><p id="message" role="status" class="status"></p><div id="list" class="cards"></div>
<details class="panel"><summary>批量导入上游连接信息</summary><p class="hint">支持之前的混合配置文本及包含 base_url、api_key、multiplier 的 JSON 数组。忽略模板模型名；导入只记录资料。</p><textarea id="import-text" rows="6" autocomplete="off" spellcheck="false" placeholder="粘贴上游配置文本"></textarea><div class="actions"><button id="import">提取并记录</button></div><p id="import-status" class="status" role="status"></p></details>
</main><dialog id="editor"><form id="channel-form" autocomplete="off"><div class="dialog-heading"><h2 id="editor-title">新增已上线渠道</h2><button type="button" id="close" class="secondary">关闭</button></div>
<input id="id" type="hidden"><input id="version" type="hidden"><label>Base URL<input id="url" type="url" required placeholder="https://api.example.com/v1"></label><label>渠道名称<input id="name" maxlength="160" placeholder="留空时使用地址中的主机名"></label><label>API Key<input id="key" type="password" maxlength="4096" autocomplete="new-password" spellcheck="false" required></label><p class="hint">编辑时留空保留已有密钥。</p>
<div class="two"><label>倍率<input id="multiplier" type="number" step="any" min="0.000001" max="1000" required placeholder="例如 0.7"></label><label>分类 / 用途标签<input id="scope" maxlength="80" placeholder="例如 codex、claude"></label><label>状态<select id="state"><option value="online">已上线</option><option value="recorded">已记录，待确认</option></select></label><label class="check"><input id="enabled" type="checkbox" checked>允许测试工具使用此渠道</label></div>
<label>备注<textarea id="note" rows="2" maxlength="2000"></textarea></label><p id="form-error" class="error" role="alert"></p><button id="save" type="submit">保存渠道</button></form></dialog></body></html>
