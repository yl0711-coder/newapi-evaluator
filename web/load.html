<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>压力测试 · 模型渠道测试平台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar"><div class="inner">
  <span class="logo">模型渠道测试平台</span>
  <nav>
    <a href="index.html">首页</a>
    <a href="workspace.html" class="on">模型工作台</a>
    <a href="history.html">任务与报告</a>
  </nav>
</div></div>

<div class="page">
  <h1>压力测试</h1>
  <p class="lead">压力流量只由已配对的本地执行器产生；云端仅分发加密任务并接收签名结果。</p>
  <div id="notice" class="notice err hide"></div>

  <div class="card">
    <b>① 选择本地执行器</b>
    <div class="row" style="margin-top:12px"><div class="field"><label>在线执行器</label><select id="f-runner"></select><div class="help" id="runner-status"></div></div><div class="field"><label>配对新电脑</label><div class="flex"><input id="runner-name" placeholder="例如 测试电脑-A"><button type="button" id="create-pairing-code">生成一次性配对码</button></div><div class="help" id="pairing-result">配对码 10 分钟有效，只显示一次。</div></div></div>
    <div class="help">在目标电脑运行 <code>python local_runner.py pair 平台地址 配对码</code>，之后运行 <code>python local_runner.py run 平台地址</code>。</div>
  </div>

  <div class="card">
    <b>② 选择渠道</b>
    <div class="field" style="margin-top:12px">
      <label>渠道</label>
      <select id="f-target"></select>
    </div>
  </div>

  <div class="card">
    <b>③ 设置负载模型</b>
    <div class="row" style="margin-top:12px">
      <div class="field"><label>模式</label><select id="f-mode">
        <option value="closed">闭环固定并发</option><option value="open">开环固定速率（req/s）</option>
      </select></div>
      <div class="field"><label>负载档位</label>
        <input id="f-levels" value="10,20,30,40,50" placeholder="例如 10,20,30,40,50"></div>
      <div class="field"><label>每档请求数</label>
        <input id="f-requests" type="number" min="10" max="200" value="20"></div>
    </div>
    <div class="row">
      <div class="field"><label>题型</label><select id="f-profile">
        <option value="simple">简单短输出（默认 64 token）</option>
        <option value="reasoning">轻推理（默认 512 token）</option>
        <option value="coding">编程长输出（默认 1600 token）</option>
      </select></div>
      <div class="field"><label>输出上限（留空使用题型默认）</label><input id="f-max-tokens" type="number" min="16" max="8192"></div>
      <div class="field"><label>每轮冷却（秒）</label><input id="f-cooldown" type="number" min="0" max="300" value="10"></div>
    </div>
    <div class="row">
      <div class="field"><label>闭环思考间隔（秒）</label><input id="f-interval" type="number" min="0" max="10" step="0.1" value="0"></div>
      <div class="field"><label>开环突发周期（秒）</label><input id="f-burst" type="number" min="1" max="10" step="1" value="1"></div>
      <div class="field"><label>客户端最大在飞</label><input id="f-max-inflight" type="number" min="1" max="1000" value="250"></div>
    </div>
    <label class="small"><input id="f-stream" type="checkbox" checked style="width:auto"> 使用流式请求，测真实 TTFT 与断流</label>
    <div class="help">每档旧题与新题各占一半；轮间冷却。闭环测并发，开环测到达率与发生器在飞上限。</div>
  </div>

  <div class="card">
    <b>④ 确认成本后提交</b>
    <div class="metrics" id="est" style="margin-top:14px"></div>
    <div class="field"><label>费用上限（¥，留空用默认）</label>
      <input id="f-limit" type="number" step="0.01" style="max-width:200px"></div>
    <div class="actions">
      <button class="primary" id="btn-submit">开始压力测试</button>
      <a href="workspace.html" class="small muted">返回模型工作台</a>
    </div>
  </div>
</div>
<script src="app.js"></script>
<script src="load.js"></script>
</body>
</html>
