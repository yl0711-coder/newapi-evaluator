<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工作台 V2 交互 Demo</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="workspace.css?v=demo"><style>.demo-badge{padding:4px 9px;border-radius:20px;background:#7c3aed;color:#fff;font-size:11px}.demo-actions{display:flex;gap:8px}.demo-modal{width:min(680px,calc(100vw - 32px));border:1px solid var(--line);border-radius:13px;background:var(--card);color:var(--text)}.demo-modal::backdrop{background:rgba(2,6,23,.72)}.demo-modal form{padding:22px}.demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.demo-note{padding:11px;border:1px solid var(--brand-line);border-radius:8px;background:var(--brand-bg);color:var(--muted);font-size:12px}</style></head>
<body><div class="topbar"><div class="inner workspace-topbar"><span class="logo">模型渠道测试平台 <i class="demo-badge">交互 Demo</i></span><nav><a href="workspace.html">返回正式工作台</a></nav></div></div>
<main class="workbench"><header class="workspace-heading"><div><div class="eyebrow">平台倍率 → 渠道倍率 → 模型包</div><h1>模型倍率工作台</h1><p class="lead">此页面只使用内置模拟数据，刷新即可复原。</p></div><div class="demo-actions"><button id="demo-add-model">模拟新增模型</button><button id="demo-add-group">＋ 平台倍率组</button><button class="primary" id="demo-admission">＋ 准入测试</button></div></header>
<section class="overview-strip"><div><span>平台组</span><strong id="d-groups">2</strong></div><div><span>渠道</span><strong>4</strong></div><div><span>模型</span><strong>9</strong></div><div><span>已设标杆</span><strong id="d-benches">3</strong></div><div><span>需要关注</span><strong class="attention">2</strong></div></section>
<nav class="platform-tabs" id="d-tabs"></nav><section class="platform-context"><div><div class="eyebrow">当前平台分组</div><h2 id="d-title"></h2><div class="family-roster" id="d-roster"></div></div></section><section class="toolbar"><label class="search-box"><span>⌕</span><input placeholder="搜索渠道、模型或标杆…"></label><div class="segmented"><button class="on">全部</button><button>仅需关注</button><button>仅标杆</button></div></section><section id="d-content" class="channel-groups"></section></main>
<dialog class="demo-modal" id="d-group-dialog"><form method="dialog"><div class="dialog-head"><div><div class="eyebrow">新建一级分组</div><h2>平台倍率组</h2></div><button value="cancel" class="icon-button">×</button></div><div class="demo-grid"><div class="field"><label>模型家族</label><select id="d-group-family"><option>Claude</option><option>Codex</option></select></div><div class="field"><label>平台上线倍率</label><input id="d-group-rate" type="number" step="0.1" value="1.5"></div></div><div class="dialog-actions"><button value="cancel">取消</button><button type="button" class="primary" id="d-save-group">创建并切换</button></div></form></dialog>
<dialog class="demo-modal" id="d-benchmark-dialog"><form method="dialog"><div class="dialog-head"><div><div class="eyebrow">逐模型标杆</div><h2 id="d-benchmark-title">设置为标杆</h2></div><button value="cancel" class="icon-button">×</button></div><div class="current-benchmark" id="d-current-benchmark"></div><div class="demo-grid"><div class="field"><label>目标平台组</label><select id="d-benchmark-group"></select></div><div class="field"><label>目标模型</label><select id="d-benchmark-model"></select></div></div><div class="field"><label>来源结果</label><select><option>最新完整结果 · 92 分 · 今天 10:32</option><option>能力评测 · 90 分 · 昨天 17:20</option></select></div><div class="field"><label>允许容差</label><input type="number" value="10"></div><div class="demo-note">目标槽位已有标杆时，保存会替换当前标杆，原记录继续保留。</div><div class="dialog-actions"><button type="button" class="danger" id="d-unset-benchmark">取消当前标杆</button><button value="cancel">关闭</button><button type="button" class="primary" id="d-save-benchmark">设置标杆</button></div></form></dialog>
<dialog class="demo-modal" id="d-admission-dialog"><form method="dialog"><div class="dialog-head"><div><div class="eyebrow">单家族批量准入</div><h2>发起准入测试</h2></div><button value="cancel" class="icon-button">×</button></div><div class="demo-grid"><div class="field"><label>渠道</label><select><option>渠道 A</option><option>渠道 B</option></select></div><div class="field"><label>目标平台组</label><select id="d-admission-group"></select></div><div class="field"><label>上游采购倍率</label><input type="number" value="0.7" step="0.1"></div></div><div class="demo-note" id="d-admission-preview"></div><div class="metrics" style="margin-top:14px"><div class="metric"><div class="k">模型数</div><div class="v" id="d-admission-count">3</div></div><div class="metric"><div class="k">预计请求</div><div class="v" id="d-admission-requests">54</div></div><div class="metric"><div class="k">预计费用</div><div class="v" id="d-admission-cost">¥0.1842</div></div></div><div class="dialog-actions"><button value="cancel">取消</button><button type="button" class="primary" id="d-submit-admission">加入测试队列</button></div></form></dialog>
<div class="workspace-toast" id="d-toast"></div><script>
const demo={groups:[{id:1,family:'Claude',rate:1.2,models:['Fable 5','Opus 5','Sonnet 5'],bench:new Set(['Opus 5','Sonnet 5']),channels:[{name:'渠道 A',upstream:.7,pending:[],models:[['Fable 5',86,'观察'],['Opus 5',94,'推荐'],['Sonnet 5',92,'推荐']]},{name:'渠道 B',upstream:.55,pending:[],models:[['Fable 5',78,'需复核'],['Opus 5',90,'推荐'],['Sonnet 5',88,'推荐']]}]},{id:2,family:'Codex',rate:1,models:['GPT-5.6 Sol','GPT-5.6 Terra'],bench:new Set(['GPT-5.6 Sol']),channels:[{name:'渠道 C',upstream:.6,pending:[],models:[['GPT-5.6 Sol',91,'推荐'],['GPT-5.6 Terra',84,'观察']]}]}],selected:1};
const q=s=>document.querySelector(s);const qa=s=>[...document.querySelectorAll(s)];const selected=()=>demo.groups.find(g=>g.id===demo.selected);function toast(t){const e=q('#d-toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}function render(){const g=selected();q('#d-tabs').innerHTML=demo.groups.map(x=>`<button class="platform-tab ${x.id===g.id?'on':''}" data-tab="${x.id}"><strong>${x.family}</strong><span>${x.rate}x</span><small>${x.channels.length} 个渠道倍率组</small></button>`).join('');q('#d-title').textContent=`${g.family} ${g.rate}x`;q('#d-roster').innerHTML=g.models.map(m=>`<span class="roster-chip ${g.bench.has(m)?'ready':''}">${m}<i>${g.bench.has(m)?'已设标杆':'待设标杆'}</i></span>`).join('');q('#d-content').innerHTML=g.channels.map((c,i)=>`<details class="channel-group" ${i===0?'open':''}><summary><span><i class="chevron">›</i><strong>${c.name} · 上游 ${c.upstream}x</strong><small>${c.models.length} 个已测模型</small></span><span class="channel-health">${c.pending.length?c.pending.length+' 个待补测':'模型包完整'}</span></summary>${c.pending.length?`<div class="pending-banner"><span>新增模型待测试：${c.pending.join('、')}</span><button data-demo-supplement>一键补测</button></div>`:''}<div class="model-list">${c.models.map(m=>`<article class="model-item"><details><summary class="model-row"><span class="model-identity"><i class="chevron">›</i><span><strong>${m[0]}</strong><small>${c.name} · ${m[0]}</small></span></span><span><small>最近得分</small><b class="score">${m[1]}</b></span><span><small>同模型标杆</small><b class="${g.bench.has(m[0])?'':'warn-text'}">${g.bench.has(m[0])?'当前标杆':'尚未设置'}</b></span><span><small>状态</small><span class="tag ${m[2]==='推荐'?'ok':'warn'}">${m[2]}</span></span></summary><div class="model-detail"><div><h3>最近报告</h3><a class="report-entry"><span>接入检测</span><b>${m[2]}</b><strong>${m[1]} 分</strong><time>今天 10:32</time></a><a class="report-entry"><span>定期巡检</span><b>正常</b><strong>${m[1]-1} 分</strong><time>昨天 09:00</time></a></div><aside><h3>商业倍率映射</h3><p class="small">${c.name} · 上游 ${c.upstream}x → ${g.family} ${g.rate}x</p></aside></div></details><div class="model-controls"><label><input type="checkbox" checked> 加入定时测试</label><label><input type="checkbox" data-demo-benchmark="${m[0]}" ${g.bench.has(m[0])?'checked':''}> 设置为标杆</label></div></article>`).join('')}</div></details>`).join('');q('#d-groups').textContent=demo.groups.length;q('#d-channels').textContent=demo.groups.reduce((n,x)=>n+x.channels.length,0);q('#d-models').textContent=demo.groups.reduce((n,x)=>n+x.channels.reduce((sum,c)=>sum+c.models.length,0),0);q('#d-benches').textContent=demo.groups.reduce((n,x)=>n+x.bench.size,0);bind()}
function bind(){qa('[data-tab]').forEach(b=>b.onclick=()=>{demo.selected=Number(b.dataset.tab);render()});qa('[data-demo-benchmark]').forEach(b=>b.onclick=e=>{e.preventDefault();openBenchmark(b.dataset.demoBenchmark)});qa('[data-demo-supplement]').forEach(b=>b.onclick=()=>{selected().channels.forEach(c=>{if(c.pending.length){c.pending.forEach(m=>c.models.push([m,0,'未检测']));c.pending=[]}});render();toast('已把新增模型加入补测队列')})}function groupOptions(){return demo.groups.map(g=>`<option value="${g.id}">${g.family} ${g.rate}x</option>`).join('')}function openBenchmark(model){q('#d-benchmark-title').textContent=`${model} · 设置为标杆`;q('#d-benchmark-group').innerHTML=groupOptions();q('#d-benchmark-group').value=String(demo.selected);syncBenchModels(model);q('#d-benchmark-dialog').showModal()}function syncBenchModels(prefer){const g=demo.groups.find(x=>x.id===Number(q('#d-benchmark-group').value));q('#d-benchmark-model').innerHTML=g.models.map(m=>`<option ${m===prefer?'selected':''}>${m}</option>`).join('');const m=q('#d-benchmark-model').value;q('#d-current-benchmark').innerHTML=g.bench.has(m)?`<span>当前标杆</span><b>${g.family} ${g.rate}x · ${m}</b><small>综合 91 分 · 容差 10%</small>`:'目标模型尚未设置标杆'}q('#demo-add-group').onclick=()=>q('#d-group-dialog').showModal();q('#d-save-group').onclick=()=>{const family=q('#d-group-family').value,rate=Number(q('#d-group-rate').value);const models=family==='Claude'?['Fable 5','Opus 5','Sonnet 5']:['GPT-5.6 Sol','GPT-5.6 Terra'];const id=Math.max(...demo.groups.map(g=>g.id))+1;demo.groups.push({id,family,rate,models,bench:new Set(),channels:[]});demo.selected=id;q('#d-group-dialog').close();render();toast(`已创建 ${family} ${rate}x`)};q('#d-benchmark-group').onchange=()=>syncBenchModels();q('#d-benchmark-model').onchange=()=>syncBenchModels(q('#d-benchmark-model').value);q('#d-save-benchmark').onclick=()=>{const g=demo.groups.find(x=>x.id===Number(q('#d-benchmark-group').value));g.bench.add(q('#d-benchmark-model').value);q('#d-benchmark-dialog').close();render();toast('标杆已设置，旧记录已保留')};q('#d-unset-benchmark').onclick=()=>{const g=demo.groups.find(x=>x.id===Number(q('#d-benchmark-group').value));g.bench.delete(q('#d-benchmark-model').value);q('#d-benchmark-dialog').close();render();toast('当前标杆已取消')};q('#demo-admission').onclick=()=>{q('#d-admission-group').innerHTML=groupOptions();q('#d-admission-group').value=String(demo.selected);previewAdmission();q('#d-admission-dialog').showModal()};function previewAdmission(){const g=demo.groups.find(x=>x.id===Number(q('#d-admission-group').value));const requests=g.models.length*18;q('#d-admission-preview').innerHTML=`<b>${g.family} ${g.rate}x</b> 将自动测试：${g.models.join('、')}。完成后逐模型对比本组标杆。`;q('#d-admission-count').textContent=g.models.length;q('#d-admission-requests').textContent=requests;q('#d-admission-cost').textContent=`¥${(g.models.length*0.0614).toFixed(4)}`}q('#d-admission-group').onchange=previewAdmission;q('#d-submit-admission').onclick=()=>{q('#d-admission-dialog').close();toast('已按模型包加入准入队列')};q('#demo-add-model').onclick=()=>{const g=selected();const model=g.family==='Claude'?'Claude Nova 5':'GPT-5.6 Luna';if(!g.models.includes(model)){g.models.push(model);g.channels.forEach(c=>c.pending.push(model));render();toast(`${model} 已加入模型包，已有渠道标记为待补测`)}};render();
</script></body></html>
