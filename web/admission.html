<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>准入测试 · 模型渠道测试平台</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admission.css"></head>
<body><div class="topbar"><div class="inner"><span class="logo">模型渠道测试平台</span><nav><a href="index.html">首页</a><a href="workspace.html">模型工作台</a><a href="history.html">任务与报告</a></nav></div></div>
<div class="page admission-page"><div class="admission-heading"><div><h1>新渠道接入</h1><p class="lead">固定运行智力、流式稳定性和速度对比。</p></div><span id="draft-state" class="soft-tag">草稿自动保存</span></div><div class="wizard-progress"><span>1 连接</span><i></i><span>2 目标组</span><i></i><span>3 模型</span><i></i><span>4 确认</span></div><div id="notice" class="notice err hide"></div>
  <div class="card"><b>① 选择已有渠道或新建连接</b><div class="field" style="margin-top:12px"><label>渠道</label><select id="f-channel"><option value="">＋ 新建渠道</option></select><div class="help" id="channel-tip">同一个 Key 只绑定一个模型家族。</div></div>
    <div id="channel-form"><div class="secondary-step"><div class="field"><label>粘贴连接信息自动提取</label><textarea id="f-import-text" rows="4" placeholder="支持 JSON、curl、BASE_URL / API_KEY 或普通文本"></textarea><div class="help">只在保存连接时使用识别出的 Key，页面不会回显明文。</div></div><div class="flex"><button type="button" id="btn-import-config">自动提取并填写</button><span id="import-result" class="small muted"></span></div></div><div class="row"><div class="field"><label>渠道名称</label><input id="f-name" placeholder="例如：供应商 A"></div><div class="field"><label>协议</label><select id="f-protocol"><option value="openai">OpenAI Compatible</option><option value="anthropic">Anthropic</option></select></div></div><div class="field"><label>上游地址</label><input id="f-base_url" placeholder="https://example.com/v1"></div><div class="field"><label>API Key</label><input id="f-api_key" type="password" autocomplete="off"><div class="help" id="key-tip">可以手动填写，也可以从上方粘贴内容安全识别。</div></div><button type="button" id="btn-save-channel">保存渠道连接</button></div>
  </div>
  <div class="card"><b>② 选择期望加入的平台倍率组</b><div class="row" style="margin-top:12px"><div class="field"><label>目标平台组</label><select id="f-platform-group"></select></div><div class="field"><label>上游采购倍率</label><input id="f-upstream-rate" type="number" min="0.01" max="100" step="0.01" placeholder="例如 0.7"></div></div>
    <details class="inline-create"><summary>＋ 新建平台倍率组</summary><div class="row" style="margin-top:10px"><div class="field"><label>模型家族</label><select id="f-new-family"></select></div><div class="field"><label>平台上线倍率</label><input id="f-new-platform-rate" type="number" min="0.01" max="100" step="0.01" placeholder="例如 1.2"></div></div><button type="button" id="btn-create-platform-group">创建并选中</button></details>
    <div id="family-preview" class="notice info" style="margin-top:12px"></div>
  </div>
  <div class="card"><b>③ 发现并确认模型</b><p class="help">读取上游模型清单，与所选平台组的规范模型包比对。读取失败时仍可按平台模型包继续，缺失项会在准入报告中显示。</p><button type="button" id="btn-discover-models">读取上游模型清单</button><div id="model-discovery" class="model-discovery"><span class="muted">尚未读取；当前默认采用平台模型包。</span></div><label class="confirm-check"><input type="checkbox" id="confirm-models"> 我确认按平台模型包提交测试</label></div>
  <div class="card"><b>④ 确认价格与固定测试计划</b><div class="row" style="margin-top:12px"><div class="field"><label>输入价（¥ / 1M token）</label><input id="f-price_in" type="number" step="0.01"></div><div class="field"><label>输出价（¥ / 1M token）</label><input id="f-price_out" type="number" step="0.01"></div></div><div class="metrics" id="est" style="margin-top:14px"></div><div class="help" id="est-note" style="margin-top:10px"></div><details class="advanced-plan"><summary>查看题库与版本明细</summary><div id="plan-versions" class="help"></div></details><div class="actions"><button class="primary" id="btn-submit">确认计划并加入测试队列</button><a href="workspace.html" class="small muted">返回工作台</a></div></div>
</div><script src="app.js"></script><script src="admission.js?v=20260828-simple-v2"></script></body></html>
