name: model-test-workbench

services:
  workbench:
    image: ${WORKBENCH_IMAGE:-ghcr.io/yl0711-coder/newapi-evaluator:latest}
    pull_policy: always
    init: true
    restart: unless-stopped
    ports:
      - "${PLATFORM_BIND_ADDRESS:-127.0.0.1}:${PLATFORM_PORT:-8090}:8090"
    environment:
      PLATFORM_USERNAME: ${PLATFORM_USERNAME:-admin}
      PLATFORM_PASSWORD: ${PLATFORM_PASSWORD:?set PLATFORM_PASSWORD in .env}
      PLATFORM_EGRESS_ALLOWLIST: ${PLATFORM_EGRESS_ALLOWLIST:-}
      STABILITY_TIMEZONE: ${STABILITY_TIMEZONE:-Asia/Shanghai}
      STABILITY_RETENTION_DAYS: ${STABILITY_RETENTION_DAYS:-5}
      ADMISSION_FEISHU_APP_ID: ${ADMISSION_FEISHU_APP_ID:-}
      ADMISSION_FEISHU_APP_SECRET: ${ADMISSION_FEISHU_APP_SECRET:-}
      ADMISSION_FEISHU_APP_TOKEN: ${ADMISSION_FEISHU_APP_TOKEN:-}
      ADMISSION_FEISHU_TABLE_ID: ${ADMISSION_FEISHU_TABLE_ID:-}
      ADMISSION_FEISHU_CHANNEL_FIELD: ${ADMISSION_FEISHU_CHANNEL_FIELD:-}
      ADMISSION_FEISHU_GROUP_FIELD: ${ADMISSION_FEISHU_GROUP_FIELD:-}
      TZ: ${STABILITY_TIMEZONE:-Asia/Shanghai}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "scripts/container_healthcheck.py"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 15s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
