<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>输入 Token 用量监测</title><link rel="stylesheet" href="/assets/common.css"><link rel="stylesheet" href="./styles.css"></head>
<body><main class="page container"><header><h1>输入 Token 用量监测</h1><p>用固定长输入比较同模型、同协议的候选端与可信参照端。结论只针对上游用量上报，实际计费待账单核实。</p></header>
<p id="message" role="status" aria-live="polite"></p>
<section class="panel"><h2>模型与可信参照</h2><div class="actions"><a href="/channels/#shared-models" target="_blank" rel="noopener noreferrer">管理共用模型</a><button id="refresh-models" type="button" class="secondary">刷新模型选项</button></div><div class="form-grid"><label>模型<select id="model"></select></label><label>协议<select id="protocol"><option value="openai">Chat Completions</option><option value="responses">Responses</option><option value="anthropic">Claude Messages</option></select></label><label>可信参照渠道<select id="reference"></select></label><label>小偏差比例阈值<input id="minor-ratio" type="number" min="1.01" max="1.99" step="0.01" value="1.10"></label><label>小偏差 Token 差值阈值<input id="minor-difference" type="number" min="1" max="4096" value="128"></label></div><label class="check"><input id="trusted" type="checkbox">我确认此渠道可作为所选模型的可信参照</label><button id="save-binding">保存可信参照</button><div id="bindings" class="records"></div></section>
<section class="panel"><h2>候选渠道与半小时监测</h2><label>候选渠道<select id="candidate"></select></label><label class="check"><input id="enabled" type="checkbox">每半小时执行一次（保存后从下一时刻开始）</label><label class="check"><input id="confirm" type="checkbox">我确认允许此固定双端测试，常规 2 请求，重大异常最多 4 请求，零自动重试</label><div class="actions"><button id="preview">预览</button><button id="save-config">保存监测配置</button><button id="manualcheck" disabled aria-describedby="active-help">立即测试</button></div><p id="active-help" role="status">正在读取主动执行状态。</p><p id="preview-result"></p><div id="configs" class="records"></div></section>
<section class="panel"><h2>执行状态与结果历史</h2><p id="executor"></p><p id="updated" role="status" aria-live="polite"></p><button id="refresh">刷新</button><div id="results" class="records"></div></section>
</main><script src="/assets/common.js"></script><script src="./app.js"></script></body></html>
