<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>准入渠道与测试分组飞书记录</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">独立小项目 · 尚未接入主应用</p>
      <h1>准入渠道与测试分组</h1>
      <p>准入测试开始时，只把参与渠道和模型家族写入飞书多维表格。人工评判结果完全由你在表格中填写，程序不读也不写。</p>
    </header>

    <p id="message" role="status"></p>

    <section class="card">
      <h2>记录本次准入参与信息</h2>
      <form id="record-form">
        <label>渠道<input id="channel" required maxlength="160" autocomplete="off"></label>
        <label>此次测试模型<select id="model" required><option value="">正在加载模型</option></select></label>
        <p id="group-preview" class="group-preview"></p>
        <button id="submit" type="submit">记录到飞书</button>
      </form>
      <p id="feishu-state" class="hint">正在读取飞书配置。</p>
    </section>

    <section class="card">
      <h2>本机写入记录</h2>
      <p class="hint">这里用于确认程序实际提交的渠道、分组和同步状态，不包含人工评判列。</p>
      <div id="records" class="list"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
