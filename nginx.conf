worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    default_type text/html;
    charset utf-8;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        server_name _;
        root /srv/reports;
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "no-store";
        location /api/ {
            proxy_pass http://control:8098;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Control-Token $http_x_control_token;
        }
        location = /healthz { default_type text/plain; return 200 "ok\n"; }
        location = / { try_files /report.html =404; }
        location = /report.html { try_files /report.html =404; }
        location / { return 404; }
    }
}
