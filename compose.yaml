services:
  report:
    image: nginx:stable-alpine@sha256:ef8676b33d681f272ba429b27658bdd7e640963279714c96bddf1dc76307f7b6
    entrypoint: ["nginx", "-g", "daemon off;"]
    user: "${DIAGNOSTIC_UID:-1000}:${DIAGNOSTIC_GID:-1000}"
    restart: unless-stopped
    ports:
      - "${REPORT_BIND:-127.0.0.1}:${REPORT_PORT:-8097}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${DIAGNOSTIC_STATE_DIR:-../hourly-diagnostic-state}/reports:/srv/reports:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/report.html"]
      interval: 30s
      timeout: 5s
      retries: 3
  toolbox:
    image: ${DIAGNOSTIC_IMAGE:-hourly-channel-diagnostic:local}
    build: .
    profiles: [tools]
    user: "${DIAGNOSTIC_UID:-1000}:${DIAGNOSTIC_GID:-1000}"
    entrypoint: ["python", "-B", "manage.py"]
    volumes:
      - ${DIAGNOSTIC_STATE_DIR:-../hourly-diagnostic-state}:/state
      - ${DIAGNOSTIC_INBOX_DIR:-../hourly-diagnostic-inbox}:/inbox:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  control:
    image: ${DIAGNOSTIC_IMAGE:-hourly-channel-diagnostic:local}
    build: .
    profiles: [monitor]
    user: "${DIAGNOSTIC_UID:-1000}:${DIAGNOSTIC_GID:-1000}"
    restart: unless-stopped
    command: ["control_server.py", "--state-dir", "/state", "--credentials", "/run/secrets/channel_credentials", "--port", "8098"]
    volumes:
      - ${DIAGNOSTIC_STATE_DIR:-../hourly-diagnostic-state}/config.json:/state/config.json
      - ${DIAGNOSTIC_STATE_DIR:-../hourly-diagnostic-state}/data:/state/data
      - ${DIAGNOSTIC_STATE_DIR:-../hourly-diagnostic-state}/reports:/state/reports
    environment:
      DIAGNOSTIC_CONTROL_TOKEN: ${DIAGNOSTIC_CONTROL_TOKEN:-}
    secrets:
      - source: channel_credentials
        target: channel_credentials
        uid: "${DIAGNOSTIC_UID:-1000}"
        gid: "${DIAGNOSTIC_GID:-1000}"
        mode: 0400
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  worker:
    image: ${DIAGNOSTIC_IMAGE:-hourly-channel-diagnostic:local}
    build: .
    profiles: [worker]
    user: "${DIAGNOSTIC_UID:-1000}:${DIAGNOSTIC_GID:-1000}"
    restart: unless-stopped
    command: ["hourly_channel_diagnostic.py", "daemon", "--config", "/state/config.json", "--credentials", "/run/secrets/channel_credentials", "--data-dir", "/state/data", "--output", "/state/reports/report.html", "--confirm-live"]
    volumes:
      - ${DIAGNOSTIC_STATE_DIR:-../hourly-diagnostic-state}/config.json:/state/config.json:ro
      - ${DIAGNOSTIC_STATE_DIR:-../hourly-diagnostic-state}/data:/state/data
      - ${DIAGNOSTIC_STATE_DIR:-../hourly-diagnostic-state}/reports:/state/reports
    secrets:
      - source: channel_credentials
        target: channel_credentials
        uid: "${DIAGNOSTIC_UID:-1000}"
        gid: "${DIAGNOSTIC_GID:-1000}"
        mode: 0400
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
secrets:
  channel_credentials:
    file: ${DIAGNOSTIC_STATE_DIR:-../hourly-diagnostic-state}/credentials.json
